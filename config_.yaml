upstream:
  base_url: "https://api.anthropic.com"
  timeout_seconds: 600

server:
  host: "0.0.0.0"
  port: 4000
  session_secret: "4b78132b41c54409943548192babfdc5"

rate_limit:
  proxy_per_minute: 60
  login_per_minute: 10

backend:
  # "claude"  = forward to Anthropic API
  # "bedrock" = call AWS Bedrock
  # "auto"
  provider: "claude"

  bedrock:
    region: "eu-west-1"
    aws_profile: "ai"
    sso_start_url: "https://tymecentral.awsapps.com/start"
    sso_state_file: "sso_state.json"
    model_map:
      claude-opus-4-7: "global.anthropic.claude-opus-4-7"
      claude-sonnet-4-6: "global.anthropic.claude-sonnet-4-6"
      claude-haiku-4-5-20251001: "global.anthropic.claude-haiku-4-5-20251001-v1:0"

  mlx:
    base_url: "http://localhost:8899"
    timeout_seconds: 300
    port: 8899
    # Model name detection decides the tool-calling protocol:
    #   any name containing "gemma" → Gemma 4 custom-token path
    #   otherwise                    → standard OpenAI tool_calls path
    model_map:
      # Gemma 4 (custom-token tool protocol)
      gemma-4-e2b-it: "mlx-community/gemma-4-e2b-it-4bit"
      gemma-4-e4b-it: "mlx-community/gemma-4-e4b-it-4bit"
      gemma-4-26B-a4b-it: "mlx-community/gemma-4-26b-a4b-it-4bit"
      gemma-4-31b: "mlx-community/gemma-4-31b-it-4bit"
      # Standard OpenAI tool calling (preferred for Claude Code tool use)
      qwen-2.5-7b-it: "mlx-community/Qwen2.5-7B-Instruct-4bit"
      qwen-2.5-14b-it: "mlx-community/Qwen2.5-14B-Instruct-4bit"
      qwen-2.5-32b-it: "mlx-community/Qwen2.5-32B-Instruct-4bit"
      qwen-2.5-coder-32b-it: "mlx-community/Qwen2.5-Coder-32B-Instruct-4bit"
      llama-3.1-8b-it: "mlx-community/Meta-Llama-3.1-8B-Instruct-4bit"
      mistral-nemo-12b-it: "mlx-community/Mistral-Nemo-Instruct-2407-4bit"

default_model: "claude-opus-4-7"

routing_rules:
  - keywords: [ "opus", "analysis", "deep reasoning", "architect" ]
    model: "claude-opus-4-7"
  - keywords: [ "haiku", "quick", "cheap", "tiny" ]
    model: "claude-haiku-4-5-20251001"

pricing:
  claude-sonnet-4-6:
    input: 3.0
    output: 15.0
    cache_write: 3.75
    cache_read: 0.30
  claude-opus-4-7:
    input: 5.0
    output: 25.0
    cache_write: 6.25
    cache_read: 0.50
  claude-haiku-4-5-20251001:
    input: 1.0
    output: 5.0
    cache_write: 1.25
    cache_read: 0.10
  gemma-4-e2b-it:
    input: 0.0
    output: 0.0
  gemma-4-e4b-it:
    input: 0.0
    output: 0.0
  gemma-4-26B-a4b-it:
